<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso de datos — Aprobación Presidencial</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #ffffff;
      --bg2:     #f5f5f3;
      --text:    #1a1a1a;
      --text2:   #666;
      --border:  rgba(0,0,0,0.12);
      --blue:    #378ADD;
      --blue-d:  #185FA5;
      --green:   #2e7d32;
      --orange:  #e67e22;
      --radius:  8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    header { margin-bottom: 2rem; }
    header h1 { font-size: 18px; font-weight: 500; }
    header p  { font-size: 13px; color: var(--text2); margin-top: 4px; }

    /* ── Form card ── */
    .form-card {
      background: var(--bg2);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      border: 1.5px solid transparent;
      transition: border-color .2s;
    }
    .form-card.editing { border-color: var(--orange); }
    .form-card h2 {
      font-size: 13px; font-weight: 600; color: var(--text2);
      margin-bottom: 1rem; text-transform: uppercase; letter-spacing: .04em;
    }
    .form-card.editing h2 { color: var(--orange); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; color: var(--text2); }
    .field input, .field select {
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 13px;
      background: #fff;
      color: var(--text);
    }
    .field input:focus, .field select:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
    .field input[readonly] { background: var(--bg); color: var(--text2); cursor: default; }
    .field.wide { grid-column: 1 / -1; }

    .form-actions { margin-top: 1rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button {
      padding: 8px 18px; border: none; border-radius: 6px;
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .btn-primary        { background: var(--blue-d); color: #fff; }
    .btn-primary:hover  { background: var(--blue); }
    .btn-primary.edit   { background: var(--orange); }
    .btn-primary.edit:hover { background: #d35400; }
    .btn-cancel         { background: var(--bg2); color: var(--text); border: 1px solid var(--border); display: none; }
    .btn-cancel:hover   { background: #e8e8e6; }
    .btn-dl             { background: var(--bg2); color: var(--text); border: 1px solid var(--border); }
    .btn-dl:hover       { background: #e8e8e6; }
    .msg { font-size: 12px; margin-top: 8px; min-height: 18px; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; margin-bottom: 2rem; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th {
      text-align: left; padding: 6px 10px; background: var(--bg2);
      color: var(--text2); font-weight: 500; white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 6px 10px; border-bottom: 0.5px solid var(--border); white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr.new-row td  { background: #f0f7ff; }
    tr.edit-row td { background: #fff8f0; }
    .action-btn {
      background: none; border: none; cursor: pointer;
      font-size: 13px; padding: 0 3px; line-height: 1;
    }
    .edit-btn { color: var(--orange); }
    .del-btn  { color: #c0392b; }
  </style>
</head>
<body>

<header>
  <h1>Ingreso de datos — Aprobación presidencial</h1>
  <p id="status">Cargando CSV…</p>
</header>

<!-- Datalists for autocomplete -->
<datalist id="dl_encuestadora"></datalist>
<datalist id="dl_producto"></datalist>
<datalist id="dl_presidente"></datalist>

<div class="form-card" id="formCard">
  <h2 id="formTitle">Nueva medición</h2>
  <div class="form-grid">
    <div class="field">
      <label>Fecha terreno</label>
      <input type="date" id="f_fecha" />
    </div>
    <div class="field">
      <label>Presidente</label>
      <input type="text" id="f_presidente" value="José Antonio Kast" list="dl_presidente" />
    </div>
    <div class="field">
      <label>Encuestadora</label>
      <input type="text" id="f_encuestadora" list="dl_encuestadora" placeholder="ej: Cadem" />
    </div>
    <div class="field">
      <label>Producto</label>
      <input type="text" id="f_producto" list="dl_producto" placeholder="ej: Plaza Pública" />
    </div>
    <div class="field">
      <label>Aprueba (%)</label>
      <input type="number" id="f_apro" min="0" max="100" step="0.1" />
    </div>
    <div class="field">
      <label>Desaprueba (%)</label>
      <input type="number" id="f_desapro" min="0" max="100" step="0.1" />
    </div>
    <div class="field">
      <label>NR / NS (%) — auto</label>
      <input type="number" id="f_nr" readonly />
    </div>
    <div class="field">
      <label>n muestra</label>
      <input type="number" id="f_n" min="1" placeholder="1000" />
    </div>
    <div class="field">
      <label>Modalidad</label>
      <select id="f_modalidad">
        <option value="online">Online</option>
        <option value="presencial">Presencial</option>
        <option value="telefono">Teléfono</option>
        <option value="mixta">Mixta</option>
      </select>
    </div>
    <div class="field">
      <label>N° informe</label>
      <input type="number" id="f_inf" min="1" />
    </div>
    <div class="field wide">
      <label>URL fuente</label>
      <input type="url" id="f_url" placeholder="https://…" />
    </div>

    <!-- Computed (read-only) -->
    <div class="field">
      <label>Neto (auto)</label>
      <input type="text" id="f_neto" readonly />
    </div>
    <div class="field">
      <label>SE aprueba (auto)</label>
      <input type="text" id="f_se_a" readonly />
    </div>
    <div class="field">
      <label>SE desaprueba (auto)</label>
      <input type="text" id="f_se_d" readonly />
    </div>
    <div class="field">
      <label>IC 95% aprueba (auto)</label>
      <input type="text" id="f_ci_a" readonly />
    </div>
    <div class="field">
      <label>IC 95% desaprueba (auto)</label>
      <input type="text" id="f_ci_d" readonly />
    </div>
  </div>

  <div class="form-actions">
    <button class="btn-primary" id="btnSubmit" onclick="submitForm()">Agregar medición</button>
    <button class="btn-cancel"  id="btnCancel" onclick="cancelEdit()">Cancelar</button>
    <button class="btn-dl"      onclick="downloadCSV()">Descargar CSV actualizado</button>
    <button class="btn-dl"      onclick="openCSV()">Abrir CSV local</button>
    <button class="btn-primary" id="btnSaveCSV" onclick="saveCSV()" style="display:none">Guardar CSV</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="table-wrap">
  <table id="tbl">
    <thead>
      <tr>
        <th></th><th>#</th><th>Fecha</th><th>Presidente</th>
        <th>Encuestadora</th><th>Producto</th>
        <th>Aprueba%</th><th>Desaprueba%</th><th>NR%</th><th>n</th>
        <th>Neto</th><th>SE apro</th><th>SE desapro</th>
        <th>IC95 apro</th><th>IC95 desapro</th>
        <th>Modalidad</th><th>Informe</th><th>URL</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
// ── Helpers ───────────────────────────────────────────────────────────────────
function waldSE(p_pct, n) { return Math.sqrt((p_pct/100) * (1 - p_pct/100) / n) * 100; }
function waldCI(p_pct, n) { return waldSE(p_pct, n) * 1.96; }

// ── State ─────────────────────────────────────────────────────────────────────
let rows          = [];
let newIds        = new Set();
let editingId     = null;   // id of row being edited, or null
let csvFileHandle = null;
let csvFileName   = 'aprobacion_presidencial.csv';

function updateSaveView() {
  document.getElementById('btnSaveCSV').style.display =
    csvFileHandle || window.showSaveFilePicker ? 'inline-block' : 'none';
}

function parseCSVText(text) {
  Papa.parse(text, {
    header: true,
    dynamicTyping: true,
    skipEmptyLines: true,
    complete: ({ data }) => {
      rows = data.filter(r => r.fecha_terreno);
      document.getElementById('status').textContent =
        rows.length + ' mediciones cargadas · ' +
        [...new Set(rows.map(r => r.encuestadora))].join(', ');
      rebuildDatalist();
      renderTable();
      prefillNextId();
      updateSaveView();
    }
  });
}

async function openCSV() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{
          description: 'CSV',
          accept: { 'text/csv': ['.csv'] }
        }],
        excludeAcceptAllOption: true,
        multiple: false
      });
      const file = await handle.getFile();
      csvFileHandle = handle;
      csvFileName = file.name || csvFileName;
      parseCSVText(await file.text());
    } catch (err) {
      if (err.name !== 'AbortError') flash('No se pudo abrir el archivo.');
    }
  } else {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,text/csv';
    input.onchange = async () => {
      if (!input.files || !input.files[0]) return;
      csvFileHandle = null;
      csvFileName = input.files[0].name;
      parseCSVText(await input.files[0].text());
      updateSaveView();
    };
    input.click();
  }
  updateSaveView();
}

async function saveCSV() {
  const csv = Papa.unparse(rows, { header: true });
  if (csvFileHandle) {
    try {
      await writeFileHandle(csvFileHandle, csv);
      flash(`Guardado en ${csvFileName}.`, true);
    } catch (err) {
      flash('Error al guardar el archivo.', false);
    }
    return;
  }

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: csvFileName,
        types: [{
          description: 'CSV',
          accept: { 'text/csv': ['.csv'] }
        }]
      });
      csvFileHandle = handle;
      csvFileName = handle.name || csvFileName;
      await writeFileHandle(handle, csv);
      flash(`Guardado en ${csvFileName}.`, true);
      updateSaveView();
    } catch (err) {
      if (err.name !== 'AbortError') flash('No se pudo guardar el archivo.');
    }
  } else {
    flash('Tu navegador no soporta guardado directo. Usa Descargar CSV.', false);
  }
}

async function writeFileHandle(handle, contents) {
  const writable = await handle.createWritable();
  await writable.write(contents);
  await writable.close();
}

// ── Load CSV ──────────────────────────────────────────────────────────────────
Papa.parse('./data/aprobacion_presidencial.csv', {
  download: true, header: true, dynamicTyping: true,
  error: err => { document.getElementById('status').textContent = 'Error: ' + err.message; },
  complete: ({ data }) => {
    rows = data.filter(r => r.fecha_terreno);
    document.getElementById('status').textContent =
      rows.length + ' mediciones cargadas · ' +
      [...new Set(rows.map(r => r.encuestadora))].join(', ');
    rebuildDatalist();
    renderTable();
    prefillNextId();
    updateSaveView();
  }
});

// ── Datalists (autocomplete suggestions from existing data) ───────────────────
function rebuildDatalist() {
  const fill = (id, values) => {
    document.getElementById(id).innerHTML =
      [...new Set(values)].filter(Boolean).map(v => `<option value="${v}">`).join('');
  };
  fill('dl_encuestadora', rows.map(r => r.encuestadora));
  fill('dl_presidente',   rows.map(r => r.presidente));

  // Product suggestions update based on the selected encuestadora
  updateProductSuggestions();
}

document.getElementById('f_encuestadora').addEventListener('input', updateProductSuggestions);

function updateProductSuggestions() {
  const enc = document.getElementById('f_encuestadora').value.trim().toLowerCase();
  const relevant = enc
    ? rows.filter(r => r.encuestadora.toLowerCase() === enc)
    : rows;
  const products = [...new Set(relevant.map(r => r.producto).filter(Boolean))];
  document.getElementById('dl_producto').innerHTML =
    products.map(v => `<option value="${v}">`).join('');
}

// ── Auto-compute fields on input ──────────────────────────────────────────────
['f_apro','f_desapro','f_n'].forEach(id =>
  document.getElementById(id).addEventListener('input', recompute)
);

function recompute() {
  const apro    = parseFloat(document.getElementById('f_apro').value);
  const desapro = parseFloat(document.getElementById('f_desapro').value);
  const n       = parseFloat(document.getElementById('f_n').value);

  document.getElementById('f_nr').value =
    (!isNaN(apro) && !isNaN(desapro)) ? +(100 - apro - desapro).toFixed(1) : '';
  document.getElementById('f_neto').value =
    (!isNaN(apro) && !isNaN(desapro)) ? +(apro - desapro).toFixed(1) : '';

  if (!isNaN(apro) && !isNaN(n) && n > 0) {
    document.getElementById('f_se_a').value = waldSE(apro, n).toFixed(4);
    document.getElementById('f_ci_a').value = waldCI(apro, n).toFixed(4);
  } else {
    document.getElementById('f_se_a').value = '';
    document.getElementById('f_ci_a').value = '';
  }
  if (!isNaN(desapro) && !isNaN(n) && n > 0) {
    document.getElementById('f_se_d').value = waldSE(desapro, n).toFixed(4);
    document.getElementById('f_ci_d').value = waldCI(desapro, n).toFixed(4);
  } else {
    document.getElementById('f_se_d').value = '';
    document.getElementById('f_ci_d').value = '';
  }
}

// ── Build row object from form ────────────────────────────────────────────────
function rowFromForm(id) {
  const get  = el => document.getElementById(el).value.trim();
  const getN = el => parseFloat(document.getElementById(el).value);
  const apro   = getN('f_apro');
  const desapro = getN('f_desapro');
  const n      = getN('f_n');
  return {
    id,
    fecha_terreno:   get('f_fecha'),
    presidente:      get('f_presidente') || 'José Antonio Kast',
    encuestadora:    get('f_encuestadora'),
    producto:        get('f_producto'),
    aprueba_pct:     apro,
    desaprueba_pct:  desapro,
    nr_pct:          +(100 - apro - desapro).toFixed(1),
    n_muestra:       n,
    se_aprueba:      +waldSE(apro,    n).toFixed(4),
    se_desaprueba:   +waldSE(desapro, n).toFixed(4),
    ci95_aprueba:    +waldCI(apro,    n).toFixed(4),
    ci95_desaprueba: +waldCI(desapro, n).toFixed(4),
    neto:            +(apro - desapro).toFixed(1),
    modalidad:       get('f_modalidad'),
    n_informe:       getN('f_inf') || '',
    url_fuente:      get('f_url'),
  };
}

// ── Validate form ─────────────────────────────────────────────────────────────
function validate() {
  const get  = el => document.getElementById(el).value.trim();
  const getN = el => parseFloat(document.getElementById(el).value);
  if (!get('f_fecha'))                        return 'Falta la fecha.';
  if (!get('f_encuestadora'))                 return 'Falta la encuestadora.';
  if (isNaN(getN('f_apro')))                  return 'Falta % aprueba.';
  if (isNaN(getN('f_desapro')))               return 'Falta % desaprueba.';
  if (getN('f_apro') + getN('f_desapro') > 100) return 'Aprueba + desaprueba supera 100%.';
  if (isNaN(getN('f_n')) || getN('f_n') < 1) return 'Falta n muestra válido.';
  return null;
}

// ── Submit (add or update) ────────────────────────────────────────────────────
function submitForm() {
  const err = validate();
  if (err) return flash(err);

  if (editingId !== null) {
    // Update existing row in place
    const idx = rows.findIndex(r => r.id === editingId);
    rows[idx] = rowFromForm(editingId);
    rows.sort((a, b) => a.fecha_terreno.localeCompare(b.fecha_terreno));
    flash('Medición actualizada.', true);
    cancelEdit();
  } else {
    // Add new row
    const nextId = rows.length ? Math.max(...rows.map(r => r.id)) + 1 : 1;
    rows.push(rowFromForm(nextId));
    newIds.add(nextId);
    rows.sort((a, b) => a.fecha_terreno.localeCompare(b.fecha_terreno));
    clearForm();
    flash('Medición agregada. Descarga el CSV para guardar los cambios.', true);
    prefillNextId();
  }

  rebuildDatalist();
  renderTable();
}

// ── Edit row ──────────────────────────────────────────────────────────────────
function startEdit(id) {
  const r = rows.find(r => r.id === id);
  if (!r) return;
  editingId = id;

  document.getElementById('f_fecha').value        = r.fecha_terreno;
  document.getElementById('f_presidente').value   = r.presidente;
  document.getElementById('f_encuestadora').value = r.encuestadora;
  document.getElementById('f_producto').value     = r.producto;
  document.getElementById('f_apro').value         = r.aprueba_pct;
  document.getElementById('f_desapro').value      = r.desaprueba_pct;
  document.getElementById('f_n').value            = r.n_muestra;
  document.getElementById('f_inf').value          = r.n_informe;
  document.getElementById('f_url').value          = r.url_fuente || '';
  document.getElementById('f_modalidad').value    = r.modalidad || 'online';
  recompute();

  document.getElementById('formTitle').textContent  = `Editando medición #${r.id} — ${r.encuestadora} ${r.fecha_terreno}`;
  document.getElementById('btnSubmit').textContent   = 'Guardar cambios';
  document.getElementById('btnSubmit').classList.add('edit');
  document.getElementById('btnCancel').style.display = 'inline-block';
  document.getElementById('formCard').classList.add('editing');
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  renderTable(); // highlight edited row
}

function cancelEdit() {
  editingId = null;
  clearForm();
  document.getElementById('formTitle').textContent   = 'Nueva medición';
  document.getElementById('btnSubmit').textContent   = 'Agregar medición';
  document.getElementById('btnSubmit').classList.remove('edit');
  document.getElementById('btnCancel').style.display = 'none';
  document.getElementById('formCard').classList.remove('editing');
  renderTable();
}

// ── Delete row ────────────────────────────────────────────────────────────────
function deleteRow(id) {
  if (!confirm('¿Eliminar esta medición?')) return;
  if (editingId === id) cancelEdit();
  rows = rows.filter(r => r.id !== id);
  newIds.delete(id);
  rebuildDatalist();
  renderTable();
}

// ── Render table ──────────────────────────────────────────────────────────────
function renderTable() {
  document.getElementById('tbody').innerHTML = rows.map(r => `
    <tr class="${editingId === r.id ? 'edit-row' : newIds.has(r.id) ? 'new-row' : ''}">
      <td>
        <button class="action-btn edit-btn" onclick="startEdit(${r.id})" title="Editar">✎</button>
        <button class="action-btn del-btn"  onclick="deleteRow(${r.id})" title="Eliminar">✕</button>
      </td>
      <td>${r.id}</td>
      <td>${r.fecha_terreno}</td>
      <td>${r.presidente}</td>
      <td>${r.encuestadora}</td>
      <td>${r.producto}</td>
      <td>${r.aprueba_pct}</td>
      <td>${r.desaprueba_pct}</td>
      <td>${r.nr_pct}</td>
      <td>${r.n_muestra.toLocaleString('es-CL')}</td>
      <td>${r.neto > 0 ? '+' : ''}${r.neto}</td>
      <td>${r.se_aprueba}</td>
      <td>${r.se_desaprueba}</td>
      <td>${r.ci95_aprueba}</td>
      <td>${r.ci95_desaprueba}</td>
      <td>${r.modalidad}</td>
      <td>${r.n_informe}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis">
        ${r.url_fuente ? `<a href="${r.url_fuente}" target="_blank" style="color:var(--blue-d)">link</a>` : '—'}
      </td>
    </tr>
  `).join('');
}

// ── Download updated CSV ──────────────────────────────────────────────────────
function downloadCSV() {
  const csv  = Papa.unparse(rows, { header: true });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'), { href: url, download: csvFileName }).click();
  URL.revokeObjectURL(url);
}

// ── Misc helpers ──────────────────────────────────────────────────────────────
function flash(msg, ok = false) {
  const el = document.getElementById('msg');
  el.style.color = ok ? 'var(--green)' : '#c0392b';
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 4000);
}

function clearForm() {
  ['f_fecha','f_encuestadora','f_producto','f_apro','f_desapro',
   'f_nr','f_n','f_url','f_neto','f_se_a','f_se_d','f_ci_a','f_ci_d']
    .forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('f_presidente').value = 'José Antonio Kast';
}

function prefillNextId() {
  const maxInf = Math.max(0, ...rows.map(r => +r.n_informe || 0));
  if (maxInf) document.getElementById('f_inf').value = maxInf + 1;
}
</script>
</body>
</html>
