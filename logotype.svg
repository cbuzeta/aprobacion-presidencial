<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="lt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <rect width="80" height="80" rx="16" fill="url(#lt-bg)"/>
  <rect x="13" y="13" width="54" height="54" rx="9"
    fill="white" fill-opacity="0.2" stroke="#aaaaaa" stroke-width="3"/>
  <path d="M 23,41 L 35,54 L 58,25"
    stroke="#666666" stroke-width="5" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="96" y="40" dominant-baseline="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="32" letter-spacing="-0.5">
    <tspan font-weight="300" fill="#999999">Meta</tspan><tspan font-weight="600" fill="#1a1a1a">Aprobación</tspan>
  </text>
</svg>
