<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="lt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <linearGradient id="lt-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="lt-area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555555" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#555555" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lt-clip">
      <rect width="80" height="80" rx="16"/>
    </clipPath>
  </defs>

  <!-- Icon -->
  <rect width="80" height="80" rx="16" fill="url(#lt-bg)"/>
  <g clip-path="url(#lt-clip)">
    <path d="M 62,40 L 76,40 L 76,80 L 62,80 Z" fill="url(#lt-area)"/>
    <path d="M 6,25 L 14,19 L 20,27 L 27,17 L 33,25 L 39,19 L 46,26 L 52,20 C 58,20 60,36 64,40"
      stroke="#bbbbbb" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 6,40 L 13,46 L 20,33 L 27,42 L 34,35 L 41,41 L 48,35 C 54,35 59,39 64,40"
      stroke="#999999" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 6,55 L 14,61 L 21,52 L 28,59 L 35,53 L 42,58 L 49,52 C 56,52 60,44 64,40"
      stroke="#bbbbbb" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="64" cy="40" r="2.5" fill="#777777"/>
    <path d="M 64,40 L 76,40" stroke="url(#lt-line)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="96" y="40" dominant-baseline="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="32" letter-spacing="-0.5">
    <tspan font-weight="300" fill="#999999">Meta</tspan><tspan font-weight="600" fill="#1a1a1a">señal</tspan>
  </text>
</svg>
